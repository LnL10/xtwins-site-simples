<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Iniciar sessão · Gestor de Tarefas</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body data-pagina="login">
  <header><span class="marca">Gestor de Tarefas</span></header>
  <main>
    <div class="cartao estreito">
      <h1>Iniciar sessão</h1>
      <p id="aviso" class="aviso" role="status" hidden></p>
      <ul id="erros" class="erros" role="alert" hidden></ul>
      <form id="form-login" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <div class="acoes"><button type="submit">Entrar</button></div>
      </form>
      <p class="dica">Site de testes do xTwins. Nada aqui é real.</p>
    </div>
  </main>
</body>
</html>
